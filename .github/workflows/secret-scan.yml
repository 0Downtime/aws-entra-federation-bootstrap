name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive_path="$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 --retry-all-errors --output "$archive_path" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive_path" | sha256sum --check -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/gitleaks" git \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 1 \
            .
